<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#071122;color:#fff;font-family:system-ui,-apple-system,sans-serif;height:100%;overflow:hidden}

input,select{width:100%;padding:11px;margin:5px 0;border-radius:10px;border:1px solid #334155;background:#0F2340;color:#fff;font-size:14px}
label{font-size:12px;color:#B9CBE4;font-weight:700}
/* FIX 6 - SAVE BUTTON CLEARLY VISIBLE AS BUTTON */
.save{width:100%;padding:14px;background:#FACC15;border:3px solid #fff;border-radius:12px;font-weight:900;font-size:16px;color:#0A1628;margin-top:8px;box-shadow:0 4px 0 #92400E,0 6px 14px rgba(0,0,0,.45);cursor:pointer}.save:active{transform:translateY(2px);box-shadow:0 2px 0 #92400E}
.save2{width:100%;padding:12px;background:#38BDF8;border:2px solid #fff;border-radius:11px;font-weight:800;font-size:14px;color:#0A1628;margin-top:6px}
.list{background:#0F2340;border-radius:10px;padding:8px;margin-top:8px;font-size:13px;line-height:1.7}table{width:100%;border-collapse:collapse;font-size:12px}th,td{border-bottom:1px solid #334155;padding:6px 3px;text-align:left}
.item{display:flex;justify-content:space-between;gap:6px;padding:6px 0;border-bottom:1px solid #1E3A5F}.item button{background:#1E3A5F;color:#fff;border:none;border-radius:8px;padding:4px 8px;font-size:11px;margin-left:4px}
.keyBox{background:#0F2340;border:1px solid #38BDF8;border-radius:14px;padding:12px;margin-top:10px}
@media print{body{overflow:visible;background:#fff;color:#000}#app{max-width:100%;height:auto}.tabs,.hero,.noPrint{display:none!important}.main{overflow:visible}.sec{display:none!important}.sec.active{display:block!important}.box,.list{background:#fff;color:#000;border-color:#ccc}}
</style></head><body><div id="app">
<div class="topbar"><span>ROAD KING</span><b id="trialLabel">Trial Version</b></div>
<div class="tabs"><button id="tab-home" class="on" onclick="show('home')">මුල් පිටුව</button><button id="tab-monthly" onclick="show('monthly')">මාසික වාර්තාව</button><button id="tab-settings" onclick="show('settings')">සැකසීම්</button></div>
<div class="hero"><img src="tuk.jpg" alt=""><div class="overlay"><div><h1>ROAD<br><span>KING</span></h1><small id="driverLine">ටුක් ටුක් දිනපොත</small></div></div></div>
<div class="main" id="home">
<div class="row2">
<div class="box"><b>Time Table</b><div style="display:flex;gap:6px"><input id="ttName" placeholder="නම"><input id="ttTime" type="time"></div><label style="display:flex;gap:6px;align-items:center;margin-top:4px"><input type="checkbox" id="ttAlarmOn" checked style="width:auto"> එලාම්</label><button class="save" style="padding:10px;font-size:13px" onclick="addTT()">Save</button><div id="ttList" style="font-size:12px;line-height:1.6;margin-top:4px"></div></div>

</div>
<div class="cats">
<button class="b1" onclick="show('hire')">දවසේ හයර්</button><button class="b2" onclick="show('petrol')">පෙට්‍රල්</button><button class="b3" onclick="show('school')">School හයර්</button>
<button class="b4" onclick="show('leasing')">Leasing</button><button class="b5" onclick="show('service')">Service හා<br>අමතර කොටස්</button><button class="b6" onclick="show('police')">Police, Insurance,<br>License</button>
</div>

</div>
<div id="hire" class="sec"><h3>දවසේ හයර්</h3><label>නම</label><input id="hName" placeholder="නම"><label>මුදල</label><input id="hAmt" type="number" placeholder="මුදල"><label>කි.මී.</label><input id="hKm" type="number" placeholder="කි.මී."><label>ඉතිරි මුදල</label><input id="hPend" type="number" placeholder="ඉතිරි මුදල"><button class="save" onclick="saveHire()">Save</button><div id="hList" class="list"></div><button class="save2" onclick="show('home')">ආපසු</button></div>
<div id="petrol" class="sec"><h3>පෙට්‍රල්</h3><label>මුදල</label><input id="pAmt" type="number" placeholder="මුදල" oninput="calcLitre()"><label>ලීටර් <span id="litreHint" style="color:#38BDF8"></span></label><input id="pL" type="number" placeholder="ලීටර්" oninput="calcAmt()"><div id="petrolInfo" style="font-size:12px;color:#B9CBE4"></div><button class="save" onclick="savePetrol()">Save</button><div id="pList" class="list"></div><button class="save2" onclick="show('home')">ආපසු</button></div>
<div id="school" class="sec"><h3>School හයර්</h3><label>නම</label><input id="sName" placeholder="නම"><label>මාසය</label><input id="sMonth" type="month"><label>මුදල</label><input id="sAmt" type="number" placeholder="මුදල"><label>ඉතිරි මුදල</label><input id="sPend" type="number" placeholder="ඉතිරි මුදල"><button class="save" onclick="saveSchool()">Save</button><div class="list"><b>නම | මාසය | මුදල | ඉතිරි</b><div id="schoolTable"></div></div><button class="save2" onclick="show('home')">ආපසු</button></div>
<div id="leasing" class="sec"><h3>Leasing</h3><label>විස්තරය</label><input id="lDesc" placeholder="විස්තරය"><label>මුදල</label><input id="lAmt" type="number" placeholder="මුදල"><button class="save" onclick="saveGeneric('leasing','lDesc','lAmt')">Save</button><div id="leasingList" class="list"></div><button class="save2" onclick="show('home')">ආපසු</button></div>
<div id="service" class="sec"><h3>Service හා අමතර කොටස්</h3><label>විස්තරය</label><input id="svDesc" placeholder="විස්තරය"><label>මුදල</label><input id="svAmt" type="number" placeholder="මුදල"><button class="save" onclick="saveGeneric('service','svDesc','svAmt')">Save</button><div id="serviceList" class="list"></div><button class="save2" onclick="show('home')">ආපසු</button></div>
<div id="police" class="sec"><h3>Police, Insurance, License</h3><label>විස්තරය</label><input id="poDesc" placeholder="විස්තරය"><label>මුදල</label><input id="poAmt" type="number" placeholder="මුදල"><button class="save" onclick="saveGeneric('police','poDesc','poAmt')">Save</button><div id="policeList" class="list"></div><button class="save2" onclick="show('home')">ආපසු</button></div>
<div id="bill" class="sec"><h3>දවසේ Bill</h3><label>වර්ගය</label><select id="bType"><option>ආහාර පාන</option><option>සිගරට් සහ ලිකර්</option><option>රීලෝඩ්</option><option>Bet</option><option>Donate</option><option>වෙනත්</option></select><label>මුදල</label><input id="bAmt" type="number" placeholder="මුදල"><button class="save" onclick="saveBill()">Save</button><div id="bList" class="list"></div><button class="save2" onclick="show('home')">ආපසු</button></div>
<div id="monthly" class="sec"><h3>මාසික වාර්තාව</h3><label>දිනය</label><input id="calDate" type="date" onchange="render()"><div id="dayDetail" class="list"></div><div id="mReport" class="list"></div><div id="perDay" class="list"></div><div id="perDayDetail" class="list"></div><button class="save2 noPrint" style="background:#FACC15" onclick="doPrint()">PDF / Print</button><button class="save2 noPrint" onclick="screenshot()">Screenshot</button><button class="save2" onclick="show('home')">ආපසු</button></div>
<div id="settings" class="sec"><h3>සැකසීම්</h3>
<label>රියදුරු නම</label><input id="setDriver" placeholder="රියදුරු නම"><button class="save2" onclick="saveSet('driver','setDriver')">Save</button>
<label style="margin-top:12px;display:block">ටුක් අංකය</label><input id="setTuk" placeholder="ටුක් අංකය"><button class="save2" onclick="saveSet('tuk','setTuk')">Save</button>
<label style="margin-top:12px;display:block">ලීටරයක මිල</label><input id="setPetrol" type="number" placeholder="ලීටරයක මිල"><button class="save2" onclick="saveSet('petrolPrice','setPetrol')">Save</button>
<div class="keyBox"><h4 style="margin:0">Key</h4><p id="trialInfo2" style="font-size:12px;color:#FACC15"></p><label>Key</label><input id="keyInput" placeholder="RDK-XXXX-XXXX-XX-XXXX"><button class="save" onclick="activateKey()">✅ Key දාන්න</button><p id="keyMsg" style="font-size:13px"></p></div>
<hr><h4>වෙනස් කිරීම / ඉවත් කිරීම</h4><label>වර්ගය</label><select id="editCat" onchange="renderEdit()"><option value="hires">දවසේ හයර්</option><option value="petrol">පෙට්‍රල්</option><option value="school">School හයර්</option><option value="leasing">Leasing</option><option value="service">Service</option><option value="police">Police</option><option value="bills">දවසේ Bill</option><option value="tt">Time Table</option></select><div id="editList" class="list"></div><button class="save2" onclick="show('home')">ආපසු</button></div>
</div>
<script>
var D={hires:[],petrol:[],school:[],leasing:[],service:[],police:[],bills:[],tt:[],driver:'',tuk:'',petrolPrice:'',installDate:'',activated:'',key:''};
try{var _s=localStorage.getItem('rk_pro');if(_s){var _d=JSON.parse(_s);for(var k in _d)D[k]=_d[k];}}catch(e){}
if(!D.installDate){D.installDate=new Date().toISOString().slice(0,10);persist();}
function persist(){try{localStorage.setItem('rk_pro',JSON.stringify(D))}catch(e){}}
function daysLeft(){return 7-Math.floor((new Date()-new Date(D.installDate))/86400000);}
function checkKey(){var today=new Date().toISOString().slice(0,10);if(D.activated && D.activated>=today) return true; return daysLeft()>0;} function isActivated(){var today=new Date().toISOString().slice(0,10);return !!(D.activated && D.activated>=today);} function isDeactivated(){return !!(D.key && D.activated && D.activated < new Date().toISOString().slice(0,10));}
function validateKey(key){key=(key||'').trim().toUpperCase();var m=key.match(/^RDK-(\d{4})-(\d{4})-(\d+)([MDY])-(\d{4})$/);if(!m) return null;var phone=parseInt(m[1]),mm=parseInt(m[2]),dur=parseInt(m[3]),unit=m[4],chk=m[5];var exp=(phone*7+mm*13+dur*29+4317)%10000;if(('000'+exp).slice(-4)!==chk) return null;var d=new Date();var months=unit==='M'?dur:unit==='Y'?dur*12:Math.ceil(dur/30);d.setMonth(d.getMonth()+months);return d.toISOString().slice(0,10);}
function activateKey(){var k=document.getElementById('keyInput').value;var exp=validateKey(k);if(!exp){document.getElementById('keyMsg').textContent='Key එක වැරදියි.';return}var m=k.trim().toUpperCase().match(/^RDK-(\d{4})-(\d{4})-(\d+)([MDY])-(\d{4})$/);var dur=parseInt(m[3]);var unit=m[4];var label=unit==='M'?dur+' Month':unit==='Y'?dur+' Year':dur+' Day';D.activated=exp;D.key=k;D.keyLabel=label;D.keyFrom=new Date().toISOString().slice(0,10);D.keyUntil=exp;persist();document.getElementById('keyMsg').textContent='Activated - '+label+' | Until '+exp;show('home');render();}
function show(id){document.getElementById('home').style.display=(id==='home'?'flex':'none');['hire','petrol','school','leasing','service','police','bill','monthly','settings'].forEach(function(x){var el=document.getElementById(x);if(el)el.classList.toggle('active',x===id)});['home','monthly','settings'].forEach(function(t){var b=document.getElementById('tab-'+t);if(b)b.classList.toggle('on',t===id)});render();}
function addTT(){var n=document.getElementById('ttName').value;var t=document.getElementById('ttTime').value;if(!n||!t){alert('නම සහ වේලාව දාන්න');return}D.tt.push({name:n,time:t,alarm:document.getElementById('ttAlarmOn').checked});persist();render();}
function saveHire(){var n=document.getElementById('hName').value;var a=+document.getElementById('hAmt').value||0;if(!n){alert('නම දාන්න');return}D.hires.push({name:n,amount:a,km:+document.getElementById('hKm').value||0,pending:+document.getElementById('hPend').value||0,date:new Date().toISOString().slice(0,10)});persist();render();alert('Saved');}
function calcLitre(){var amt=+document.getElementById('pAmt').value||0;var price=+D.petrolPrice||0;if(price>0){var l=(amt/price).toFixed(2);document.getElementById('pL').value=l;document.getElementById('petrolInfo').textContent='ලීටර් '+l+' @ රු.'+price;}}
function calcAmt(){var l=+document.getElementById('pL').value||0;var price=+D.petrolPrice||0;if(price>0)document.getElementById('pAmt').value=Math.round(l*price);}
function savePetrol(){D.petrol.push({amount:+document.getElementById('pAmt').value||0,litre:+document.getElementById('pL').value||0,date:new Date().toISOString().slice(0,10)});persist();render();alert('Saved');}
function saveSchool(){var n=document.getElementById('sName').value;if(!n){alert('නම දාන්න');return}D.school.push({name:n,month:document.getElementById('sMonth').value,amount:+document.getElementById('sAmt').value||0,pending:+document.getElementById('sPend').value||0});persist();render();alert('Saved');}
function saveGeneric(k,did,aid){D[k].push({desc:document.getElementById(did).value,amount:+document.getElementById(aid).value||0,date:new Date().toISOString().slice(0,10)});persist();render();alert('Saved');}
function saveBill(){D.bills.push({type:document.getElementById('bType').value,amount:+document.getElementById('bAmt').value||0,date:new Date().toISOString().slice(0,10)});persist();render();alert('Saved');}
function saveSet(k,id){D[k]=document.getElementById(id).value;persist();render();}
function delItem(c,i){if(!confirm('ඉවත් කරන්නද?'))return;D[c].splice(i,1);persist();render();}
function editItem(c,i){var it=D[c][i];var v=prompt('වෙනස් කරන්න',it.amount!==undefined?it.amount:(it.desc||it.name||''));if(v===null)return;if(it.amount!==undefined)it.amount=+v||it.amount;else if(it.desc!==undefined)it.desc=v;else if(it.name!==undefined)it.name=v;persist();render();}
function renderEdit(){var cat=document.getElementById('editCat').value;var arr=D[cat]||[];var el=document.getElementById('editList');if(!arr.length){el.innerHTML='කිසිවක් නැත';return}el.innerHTML=arr.map(function(it,i){var t=it.name||it.desc||it.type||it.time||'';var a=it.amount!==undefined?(' රු.'+it.amount):'';return '<div class="item"><span>'+t+a+'</span><span><button onclick="editItem(\''+cat+'\','+i+')">වෙනස්</button><button onclick="delItem(\''+cat+'\','+i+')">ඉවත්</button></span></div>'}).join('');}
function doPrint(){window.print();}
function screenshot(){try{var c=document.createElement('canvas');c.width=800;c.height=1100;var x=c.getContext('2d');x.fillStyle='#0A1628';x.fillRect(0,0,800,1100);x.fillStyle='#fff';x.font='bold 26px sans-serif';x.fillText('ROAD KING - Monthly',40,50);x.font='16px sans-serif';var y=90;D.hires.slice(0,20).forEach(function(h){x.fillText((h.name||'')+' '+h.date+' Rs.'+h.amount,40,y);y+=26});var a=document.createElement('a');a.download='road-king.png';a.href=c.toDataURL('image/png');a.click()}catch(e){}}
function enableAlarm(){if('Notification' in window){Notification.requestPermission();}beep();alert('එලාම් ක්‍රියාත්මකයි');}
function beep(){try{var ctx=new (window.AudioContext||window.webkitAudioContext)();var o=ctx.createOscillator();o.connect(ctx.destination);o.start();setTimeout(function(){o.stop()},900)}catch(e){}try{navigator.vibrate&&navigator.vibrate(500)}catch(e){}}
function addToPhoneAlarm(t,name){try{var hh=parseInt(t.slice(0,2));var mm=parseInt(t.slice(3,5));var msg=encodeURIComponent(name||'ROAD KING');var url='intent://#Intent;action=android.intent.action.SET_ALARM;S.android.intent.extra.alarm.MESSAGE='+msg+';i.android.intent.extra.alarm.HOUR='+hh+';i.android.intent.extra.alarm.MINUTES='+mm+';end';window.location.href=url;setTimeout(function(){alert('Phone Alarm එකේ Save ඔබන්න: '+t+' - '+name)},600);}catch(e){alert('Phone Alarm එක Open කරන්න බැරි වුනා');}}
function checkAlarms(){var now=new Date();var hh=('0'+now.getHours()).slice(-2)+':'+('0'+now.getMinutes()).slice(-2);var today=now.toISOString().slice(0,10);D.tt.forEach(function(t){if(!t.alarm)return;if(t._day!==today){t._f=false;t._f10=false;t._day=today;}if(t.time===hh && !t._f){t._f=true;persist();beep();beep();if('Notification' in window && Notification.permission==='granted'){try{new Notification('ROAD KING - '+t.name+' - Now');}catch(e){}}var el=document.getElementById('ttAlarm');if(el)el.textContent='⏰ '+t.name+' - දැන්!';alert('⏰ Time Table: '+t.name+' - දැන්!');}var d=new Date();d.setHours(parseInt(t.time.slice(0,2)),parseInt(t.time.slice(3,5))-10,0,0);var h10=('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);if(h10===hh && !t._f10){t._f10=true;persist();beep();var el2=document.getElementById('ttAlarm');if(el2)el2.textContent=t.name+' විනාඩි 10යි';if('Notification' in window && Notification.permission==='granted'){try{new Notification(t.name+' විනාඩි 10යි');}catch(e){}}}});}
setInterval(checkAlarms,5000);checkAlarms();

n></div>'}).join(''):'කිසිවක් නැත';document.getElementById('hList').innerHTML=D.hires.map(h=>h.name+' | රු.'+h.amount).join('<br>')||'කිසිවක් නැත';document.getElementById('pList').innerHTML=D.petrol.map(p=>'රු.'+p.amount+' | '+p.litre+'L').join('<br>')||'කිසිවක් නැත';document.getElementById('schoolTable').innerHTML='<table><tr><th>නම</th><th>මාසය</th><th>මුදල</th><th>ඉතිරි</th></tr>'+D.school.map(s=>'<tr><td>'+s.name+'</td><td>'+s.month+'</td><td>'+s.amount+'</td><td>'+s.pending+'</td></tr>').join('')+'</table>';document.getElementById('leasingList').innerHTML=D.leasing.map(x=>x.desc+' රු.'+x.amount).join('<br>')||'කිසිවක් නැත';document.getElementById('serviceList').innerHTML=D.service.map(x=>x.desc+' රු.'+x.amount).join('<br>')||'කිසිවක් නැත';document.getElementById('policeList').innerHTML=D.police.map(x=>x.desc+' රු.'+x.amount).join('<br>')||'කිසිවක් නැත';document.getElementById('bList').innerHTML=D.bills.map(b=>b.type+' රු.'+b.amount).join('<br>')||'කිසිවක් නැත';var sel=document.getElementById('calDate').value||today;var dayH=D.hires.filter(h=>h.date===sel),dayP=D.petrol.filter(h=>h.date===sel),dayB=D.bills.filter(h=>h.date===sel);document.getElementById('dayDetail').innerHTML='<b>'+sel+'</b><br>හයර්: රු.'+dayH.reduce((a,b)=>a+b.amount,0)+' ('+dayH.length+')<br>පෙට්‍රල්: රු.'+dayP.reduce((a,b)=>a+b.amount,0)+'<br>Bill: රු.'+dayB.reduce((a,b)=>a+b.amount,0)+'<br>'+dayH.map(h=>h.name+' රු.'+h.amount+' Km '+h.km).join('<br>');var allHi=D.hires.reduce((a,b)=>a+b.amount,0),allPe=D.petrol.reduce((a,b)=>a+b.amount,0),allBi=D.bills.reduce((a,b)=>a+b.amount,0);document.getElementById('mReport').innerHTML='<b>මාසික එකතුව</b><br>ආදායම රු.'+allHi+'<br>පෙට්‍රල් රු.'+allPe+'<br>Bill රු.'+allBi+'<br>Leasing රු.'+D.leasing.reduce((a,b)=>a+b.amount,0)+'<br>Service රු.'+D.service.reduce((a,b)=>a+b.amount,0)+'<br>Police රු.'+D.police.reduce((a,b)=>a+b.amount,0)+'<br><b>ඉතිරි රු.'+(allHi-allPe-allBi)+'</b>';var by={};D.hires.forEach(h=>{by[h.date||'']=(by[h.date||'']||0)+h.amount});var days=Object.keys(by).sort();document.getElementById('perDay').innerHTML='<b>දිනෙන් දින</b><br>'+days.map(d=>d+' : රු.'+by[d]).join('<br>');var det='';days.forEach(function(d){det+='<b>'+d+'</b><br>';D.hires.filter(h=>h.date===d).forEach(h=>{det+=h.name+' - රු.'+h.amount+' - '+h.km+'km - ඉතිරි '+h.pending+'<br>'});D.petrol.filter(h=>h.date===d).forEach(p=>{det+='පෙට්‍රල් රු.'+p.amount+' '+p.litre+'L<br>'});D.bills.filter(h=>h.date===d).forEach(b=>{det+=b.type+' රු.'+b.amount+'<br>'});});document.getElementById('perDayDetail').innerHTML='<b>සම්පූර්ණ දින විස්තර</b><br>'+det;renderEdit();}
